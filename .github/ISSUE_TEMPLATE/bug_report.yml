name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen? Include the stored value if relevant.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a minimal reproduction (StackBlitz or a GitHub repository).
      placeholder: https://stackblitz.com/...
  - type: textarea
    id: code
    attributes:
      label: Minimal code
      description: The smallest snippet that shows the problem.
      render: ts
      placeholder: |
        const local = createStorage(localStorage, { count: number(0) })
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - localStorage / sessionStorage (createStorage)
        - Cookies (createCookieStore)
        - React hook (useItem)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: parsistent, React and framework (if any), and the browser or Node version.
      placeholder: parsistent 0.1.0, react 19.2.0, Next.js 16, Chrome 140
    validations:
      required: true
